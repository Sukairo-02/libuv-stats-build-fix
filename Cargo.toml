
[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
edition = "2021"
name = "libuv_stats"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi-derive = "3.0.0"
uv-sys = "0.1.1"

[dependencies.napi]
version = "3.0.0"
features = ["napi9"]

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
